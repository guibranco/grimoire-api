title: Grimoire API
description: >-
  Self-hosted Vault & Configuration Manager built with ASP.NET Core 10 and SQLite.
  Securely store secrets and feature flags, then consume them at runtime.

theme: just-the-docs

url: https://guibranco.github.io
baseurl: /grimoire-api

# ── Navigation ──────────────────────────────────────────────────────────────
nav_sort: order
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# ── Search ───────────────────────────────────────────────────────────────────
search_enabled: true
search:
  heading_level: 3
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# ── Appearance ───────────────────────────────────────────────────────────────
color_scheme: dark

# ── GitHub integration ───────────────────────────────────────────────────────
gh_edit_link: true
gh_edit_link_text: "✏️ Edit this page on GitHub"
gh_edit_repository: "https://github.com/guibranco/grimoire-api"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

# ── Footer ───────────────────────────────────────────────────────────────────
footer_content: >-
  Copyright &copy; 2025
  <a href="https://github.com/guibranco">Guilherme Branco Stracini</a>.
  Distributed by an
  <a href="https://github.com/guibranco/grimoire-api/blob/main/LICENSE">MIT license.</a>

# ── Callouts ─────────────────────────────────────────────────────────────────
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# ── Jekyll ───────────────────────────────────────────────────────────────────
plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true
